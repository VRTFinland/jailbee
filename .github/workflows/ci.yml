name: CI
on:
  push:
    branches: [main]
  pull_request:
# Lint/type-check/test only — the workflow never needs to write to the repo.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt runtime libraries
        # PySide6's QtGui/QtWidgets link against libEGL/libGL, which pytest-qt
        # loads at pytest_configure time even under the offscreen platform.
        # The runner image ships neither, so the whole session crashes with
        # "ImportError: libEGL.so.1" without these.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Install uv
        # v7 is the newest floating major tag: setup-uv stopped publishing them
        # after v7, so v8+ can only be referenced by exact version.
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/
      - run: uv run pytest -q
  docs:
    # The documentation site is generated, so a broken cross-page link or a
    # heading anchor that no longer exists is invisible in the Markdown. The
    # strict build resolves every internal reference and fails on the first
    # one that does not land; site-check enforces the no-CDN rule on the
    # output. Both run per pull request, not only on deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --only-group docs
      - run: make site
      - run: make site-check
