name: Deploy website
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "zensical.toml"
      - "scripts/docs_site.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
# The site is website/ as committed plus the docs Zensical renders from docs/,
# assembled into _site/ by `make site`. The job needs to read the repo and
# publish; it never writes to it.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv sync --only-group docs
      - run: make site
      - run: make site-check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
