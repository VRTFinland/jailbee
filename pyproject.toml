[project]
name = "jailbee"
version = "1.3.0"
description = "Manage isolated per-branch development environments using Incus system containers"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Tuomas Airaksinen", email = "tuomas.airaksinen@gisgro.com" }]
maintainers = [{ name = "Tuomas Airaksinen", email = "tuomas.airaksinen@gisgro.com" }]
keywords = [
    "incus",
    "lxc",
    "containers",
    "dev-environment",
    "cli",
    "sandbox",
    "agent-sandbox",
    "ai-agent",
    "coding-agent",
    "claude-code",
    "developer-tools",
    "git-branch",
    "isolation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "questionary>=2.0",
    "prompt-toolkit>=3.0",
    "sqlmodel>=0.0.16",
    "ruamel-yaml>=0.19.1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
jailbee = "jailbee.entry:main"
jb = "jailbee.entry:main"

[project.urls]
Homepage = "https://jailbee.gisgro.io"
Documentation = "https://jailbee.gisgro.io/docs/"
Repository = "https://github.com/VRTFinland/jailbee"
Issues = "https://github.com/VRTFinland/jailbee/issues"
Changelog = "https://github.com/VRTFinland/jailbee/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pytest-qt>=4.4",
    "PySide6>=6.7",
    "pytest-timeout>=2.3",
]
# The documentation site generator. Pinned exactly rather than floored: it is
# 0.0.x, so any release may break the build, and an upgrade should be a commit
# someone reviewed. `make site` and the CI docs job are its only callers.
docs = [
    "zensical==0.0.60",
]

[tool.uv]
# `docs` is a default group so that this repo's own containers get it: their
# `on_create` runs a bare `uv sync` in loose network mode, the one moment they
# can reach PyPI. A non-default group would never be installed there, and
# `make site` would fail in a strict container with no way to fix it locally.
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
# Pinned rather than left to discovery. `website/demo/substrate/` is a
# committed miniature application — the repo the workflow videos are recorded
# against — and it has a `tests/` directory of its own that needs FastAPI and
# its own package layout. Bare `pytest` from the repo root would collect it and
# fail on the import. Discovery previously skipped it only because that tree
# lived under a dot-directory; naming the path makes it deliberate. Passing an
# explicit path still overrides this, so `pytest website/demo/substrate` inside
# a container works as expected.
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# The sdist is a build input, not a mirror of the repo. It carries the package
# source plus whatever the wheel force-includes; prose docs, the website and
# the test suite live in git. `docs/skills` must stay — `uv build` builds the
# wheel from the sdist, so dropping it would silently ship a skill-less wheel.
include = [
    "/src/jailbee",
    "/docs/skills",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jailbee"]

[tool.hatch.build.targets.wheel.force-include]
"docs/skills" = "jailbee/skills"
