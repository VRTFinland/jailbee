# jailbee configuration. Generated by `jailbee config init`, edited for dogfooding.
# All keys are optional — delete a key to use the built-in default.
# See docs/config.md for the full reference.
#
# Dogfood scope: Python dev loop (uv sync, pytest, ruff, mypy) + git push/pull.
# Out of scope: running `jailbee new`/`jailbee init` inside the container.
# Quickstart:
#   jailbee new --net loose feat/dogfood   # loose so on_create can `uv sync` deps
#   jailbee net strict feat-dogfood        # tighten egress for normal dev
#   jailbee shell feat-dogfood
#
# `uv` itself is baked into the golden image via .jailbee/install.d/45-uv.sh —
# rebuild with `jailbee base build` after editing that snippet.

# Container UID/GID. Defaults to the current host uid/gid so that bind-mounted
# host files (~/.ssh, ~/.gnupg) stay readable inside the container.
# The unix username inside the container is always 'dev' (hardcoded in #31).
container_user:
  uid: -1   # -1 = current host uid/gid at load time
  gid: -1

# Host paths bind-mounted into every container.
# RO-mount git/GPG credentials so push/pull works without re-provisioning.
# (~/.ssh is no longer mounted here — it's seeded RW into <shared_dir>/ssh
# on `jailbee init` so SSH ControlMaster can write its sockets.)
host_mounts:
  - host: ~/.gnupg
    container: /home/dev/.gnupg
    readonly: true
  - host: ~/.gitconfig
    container: /home/dev/.gitconfig
    readonly: true
  - host: ~/.local/share/JetBrains/Toolbox
    container: /opt/jetbrains-toolbox
    readonly: true

# Shared caches — bind-mounted from <shared_dir>/<host_subpath> into every
# container, so downloads survive container churn and are reused across
# branches. Setting this key REPLACES the built-in default list (which is
# just `ssh`), so ssh must be restated here or its mount is dropped.
shared_caches:
  # SSH ControlMaster sockets + known_hosts (built-in default; keep it).
  - name: ssh
    host_subpath: ssh
    container_path: ~/.ssh
  # uv's global download/build cache. Without this, `uv sync` in on_create
  # re-fetches every PyPI wheel from the network on each new container.
  # Cache and the per-container `.venv` live on different filesystems (bind
  # mount vs. container rootfs), so uv can't hardlink — the sync-deps step
  # sets UV_LINK_MODE=copy to silence the "falling back to copy" warning.
  - name: uv
    host_subpath: caches/uv
    container_path: ~/.cache/uv

# Named optional mounts — selectable per-container with `jailbee new --mount NAME`.
optional_mounts: {}
# Example:
# optional_mounts:
#   maven_cache:
#     host: ~/.m2
#     container: /home/dev/.m2
#     description: "Maven local cache"

# Egress allowlist applied in strict mode. Each entry is either a literal
# IP/CIDR (e.g. 10.0.0.0/8) or a hostname optionally followed by :PORT
# (e.g. github.com, archive.ubuntu.com:443). Hostnames are resolved to
# IPv4 at ACL-apply time. The `loose` network mode ignores this list
# (everything reachable).
# Daily dev only needs Claude API + JetBrains licence checks. github.com,
# pypi/astral are NOT here on purpose — switch to `jailbee net loose <name>`
# for `git push`/`git fetch`/`gh`/dep installs, then back to strict.
egress_allow: []


# Container resource defaults applied at create time.
defaults:
  memory: 4GiB             # Python-only repo — modest footprint
  cpu: 4
  network: strict          # strict | loose
  storage_pool: default

# Golden image config used by `jailbee base build`.
golden:
  # alias defaults to <container_prefix>-base if unset
  ubuntu_version: "26.04"
  java: amazon-corretto-17
  node: 24
  # python is not configurable — the container Python is the base image's
  # system python3 (26.04 → 3.14).
  # libgl1 ships libGL.so.1 (the libglvnd dispatcher), which the optional
  # `[gui]` extra (PySide6/Qt) needs at import time — even fully offscreen
  # via QT_QPA_PLATFORM=offscreen. 60-gui-libs.sh already installs
  # libgl1-mesa-dri for JetBrains/Chrome host-display rendering, but that
  # alone doesn't provide libGL.so.1. Repo-specific (not every jailbee repo
  # runs Qt), so it lives here rather than in the bundled snippet.
  #
  # ttyd + ffmpeg are two of VHS's three dependencies, used to render the
  # website's terminal demos (website/demo/render.sh). The third, vhs itself,
  # plus a system Chrome, are installed by .jailbee/install.d/65-vhs.sh —
  # neither can come from apt here, and that snippet explains why.
  #
  # Nor does the nested Incus daemon used to verify jailbee's device and
  # command generation against a real daemon from inside a container: that is
  # .jailbee/install.d/75-incus.sh, which installs `incus-base` instead of
  # `incus` (the metapackage drags in qemu for VM support) and leaves the
  # units disabled. docs/manual-testing.md carries the rig recipe.
  #
  # Nothing else website-related belongs in this list either. ImageMagick is
  # installed by .jailbee/install.d/70-imagemagick.sh, because it needs
  # `dpkg --path-exclude=/usr/share/fonts/*` to install at all: its font
  # dependencies unpack into the host's read-only font mount and a plain
  # apt-get here would fail the whole transaction. Every script in
  # .jailbee/install.d/ is staged into the build automatically (see
  # golden.py) — there is no list to add a snippet to, only this file to
  # keep honest about what ends up in the image.
  #
  # Rebuild after editing any snippet: `jailbee base build`.
  extra_apt_packages:
    - libgl1
    - ttyd
    - ffmpeg

# Autostart steps run as the dev user inside the container.
#   on_create: once after `jailbee new` provisions the container (initial setup).
#   on_start:  every stopped→running transition — both `jailbee new` (after
#              on_create) and `jailbee start` (recurring launches, e.g. servers).
# Put one-shot setup in on_create, recurring launches in on_start — don't
# duplicate. See docs/config.md for the full step reference.
# Don't auto-launch the IDE/Chrome on `jailbee new` — run `jailbee ide feat-dogfood`
# when (and if) you want PyCharm. cfg.jetbrains.ide still drives that command.
jetbrains:
  ide: pycharm
  autostart: false

chrome:
  autostart: false

autostart:
  step_timeout: 600
  on_create:
    # `uv` itself is baked into the golden image (.jailbee/install.d/45-uv.sh).
    # sync-deps still runs here because it needs the cloned source tree
    # and pulls Python packages from PyPI (hence `network: loose`).
    - name: sync-deps
      run: UV_LINK_MODE=copy ~/.local/bin/uv sync
      network: loose
  on_start: []

new:
  clone_from: local
