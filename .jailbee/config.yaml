# jailbee configuration. Generated by `jailbee config init`, edited for dogfooding.
# All keys are optional — delete a key to use the built-in default.
# See docs/config.md for the full reference.
#
# Dogfood scope: Python dev loop (uv sync, pytest, ruff, mypy) + git push/pull,
# plus driving jailbee itself (`jailbee init`/`jailbee new`, e.g. to record the
# website's workflow clips) against the nested Incus daemon that
# .jailbee/install.d/75-incus.sh bakes in.
#
# Quickstart:
#   jailbee new --net loose feat/dogfood   # loose so on_create can `uv sync` deps
#   jailbee net strict feat-dogfood        # tighten egress for normal dev
#   jailbee shell feat-dogfood
#
# `uv` itself is baked into the golden image via .jailbee/install.d/45-uv.sh —
# rebuild with `jailbee base build` after editing that snippet.

# Container UID/GID. Defaults to the current host uid/gid so that bind-mounted
# host files (~/.ssh, ~/.gnupg) stay readable inside the container.
# The unix username inside the container is always 'dev' (hardcoded in #31).
container_user:
  uid: -1   # -1 = current host uid/gid at load time
  gid: -1

# No `host_mounts` here: this repo needs none of its own. Personal credentials
# (~/.gnupg, ~/.gitconfig, JetBrains Toolbox) belong in
# ~/.config/jailbee/global.yaml — via its `gpg`/`jetbrains` auto-mounts or its
# own `host_mounts` list. Don't write `host_mounts: []` here either: an empty
# list resets the global entries instead of adding nothing.

# Shared caches — bind-mounted from <shared_dir>/<host_subpath> into every
# container, so downloads survive container churn and are reused across
# branches. Setting this key REPLACES the built-in default list (which is
# just `ssh`), so ssh must be restated here or its mount is dropped.
shared_caches:
  # SSH ControlMaster sockets + known_hosts (built-in default; keep it).
  - name: ssh
    host_subpath: ssh
    container_path: ~/.ssh
  # uv's global download/build cache. Without this, `uv sync` in on_create
  # re-fetches every PyPI wheel from the network on each new container.
  # Cache and the per-container `.venv` live on different filesystems (bind
  # mount vs. container rootfs), so uv can't hardlink — the sync-deps step
  # sets UV_LINK_MODE=copy to silence the "falling back to copy" warning.
  - name: uv
    host_subpath: caches/uv
    container_path: ~/.cache/uv

# Named optional mounts — selectable per-container with `jailbee new --mount NAME`.
optional_mounts: {}
# Example:
# optional_mounts:
#   maven_cache:
#     host: ~/.m2
#     container: /home/dev/.m2
#     description: "Maven local cache"

# Egress allowlist applied in strict mode. Each entry is either a literal
# IP/CIDR (e.g. 10.0.0.0/8) or a hostname optionally followed by :PORT
# (e.g. github.com, archive.ubuntu.com:443). Hostnames are resolved to
# IPv4 at ACL-apply time. The `loose` network mode ignores this list
# (everything reachable).
# Daily dev only needs the Claude API and JetBrains licence hosts, and those
# need no entry here: enabling `agents.claude` / `jetbrains` (in global.yaml)
# appends them automatically. Note that `claude.plugins_enabled` also appends
# CLAUDE_PLUGIN_HOSTS (github.com, raw/objects/codeload.githubusercontent.com,
# registry.npmjs.org), so GitHub is already reachable in strict mode without
# an entry here.
#
# The list below exists for one purpose: running a **nested Incus rig** inside
# a dogfood container to host-verify jailbee against a real daemon (see
# docs/manual-testing.md). Egress gates the rig's *setup* — pulling an image
# and provisioning it — never a container *start*: once an image is in the
# nested daemon's store, `incus start` needs no network at all. Without these
# entries the alternative is `jailbee net loose <name>` for the whole setup.
#
# Two caveats:
#   - Hostnames resolve to IPv4 at ACL-apply time, and the pool accumulates
#     the IPs it sees over successive `jailbee-net-refresh.timer` ticks. The
#     CDN-backed hosts here (archive.ubuntu.com, images.linuxcontainers.org)
#     round-robin, so the FIRST run against a fresh entry can hit an IP the
#     ACL has not pooled yet and fail; it settles as the pool fills.
#   - A port-less entry allows every protocol and port, including UDP. Every
#     entry below names its port for that reason.
#
# Being a non-empty list, this also REPLACES any `egress_allow` set in
# global.yaml for this repo's containers.
egress_allow:
  # The `images:` remote — `golden.build_golden_image` pulls
  # `images:ubuntu/<golden.ubuntu_version>` from it.
  - images.linuxcontainers.org:443
  # apt inside the nested build/containers. Ubuntu's sources.list is http,
  # not https — port 80 is not a typo.
  - archive.ubuntu.com:80
  - security.ubuntu.com:80
  # Golden-image provisioning: the hosts provision/install.sh and
  # .jailbee/install.d/* actually fetch from.
  - astral.sh:443            # uv
  - download.docker.com:443
  - deb.nodesource.com:443
  - apt.corretto.aws:443     # Amazon Corretto JDK
  - cli.github.com:443       # gh
  - dl.google.com:443        # chrome
  - packages.mozilla.org:443 # firefox
  # `uv sync` (the sync-deps autostart step) inside a nested container.
  - pypi.org:443
  - files.pythonhosted.org:443


# Container resource defaults applied at create time.
defaults:
  # 4GiB/4 fit a Python dev loop and nothing else. Recording the website's
  # workflow clips runs jailbee against the nested Incus daemon
  # (.jailbee/install.d/75-incus.sh): a golden image build, then three or four
  # branch containers up at once, each with a dev server and a Claude session
  # in it. That does not fit in 4GiB. 8 of the host's 16 cores keeps the
  # nested image build from crawling without starving the host.
  #
  # Applied per container at create time — lifecycle.py sets limits.memory and
  # limits.cpu during `jailbee new`, not through the profile. So a new
  # container picks this up with no `jailbee apply`, and containers that
  # already exist keep the limits they were created with.
  memory: 12GiB
  cpu: 8
  network: strict          # strict | loose
  storage_pool: default

# Golden image config used by `jailbee base build`.
golden:
  # alias defaults to <container_prefix>-base if unset
  ubuntu_version: "26.04"
  # No Java or Node: jailbee is Python-only, so `stacks` stays unset and no
  # java/node version pin is needed.
  # python is not configurable — the container Python is the base image's
  # system python3 (26.04 → 3.14).
  # libgl1 ships libGL.so.1 (the libglvnd dispatcher), which the optional
  # `[gui]` extra (PySide6/Qt) needs at import time — even fully offscreen
  # via QT_QPA_PLATFORM=offscreen. 60-gui-libs.sh already installs
  # libgl1-mesa-dri for JetBrains/Chrome host-display rendering, but that
  # alone doesn't provide libGL.so.1. Repo-specific (not every jailbee repo
  # runs Qt), so it lives here rather than in the bundled snippet.
  #
  # ttyd + ffmpeg are two of VHS's three dependencies, used to render the
  # website's terminal demos (website/demo/render.sh). The third, vhs itself,
  # plus a system Chrome, are installed by .jailbee/install.d/65-vhs.sh —
  # neither can come from apt here, and that snippet explains why.
  #
  # Nor does the nested Incus daemon used to verify jailbee's device and
  # command generation against a real daemon from inside a container: that is
  # .jailbee/install.d/75-incus.sh, which installs `incus-base` instead of
  # `incus` (the metapackage drags in qemu for VM support) and leaves the
  # units disabled. docs/manual-testing.md carries the rig recipe.
  #
  # Nothing else website-related belongs in this list either. ImageMagick is
  # installed by .jailbee/install.d/70-imagemagick.sh, because it needs
  # `dpkg --path-exclude=/usr/share/fonts/*` to install at all: its font
  # dependencies unpack into the host's read-only font mount and a plain
  # apt-get here would fail the whole transaction. Every script in
  # .jailbee/install.d/ is staged into the build automatically (see
  # golden.py) — there is no list to add a snippet to, only this file to
  # keep honest about what ends up in the image.
  #
  # Rebuild after editing any snippet: `jailbee base build`.
  extra_apt_packages:
    - libgl1
    - ttyd
    - ffmpeg

# IDE that `jailbee ide feat-dogfood` opens (needs `jetbrains.enabled: true`
# in global.yaml). Neither the IDE nor Chrome auto-launches on
# `jailbee new` — `autostart` defaults to false for both.
jetbrains:
  ide: pycharm

# Autostart steps run as the dev user inside the container.
#   on_create: once after `jailbee new` provisions the container (initial setup).
#   on_start:  every stopped→running transition — both `jailbee new` (after
#              on_create) and `jailbee start` (recurring launches, e.g. servers).
# Put one-shot setup in on_create, recurring launches in on_start — don't
# duplicate. See docs/config.md for the full step reference.
autostart:
  step_timeout: 600
  on_create:
    # `uv` itself is baked into the golden image (.jailbee/install.d/45-uv.sh).
    # sync-deps still runs here because it needs the cloned source tree and
    # pulls Python packages from PyPI — hence the stage's `network: loose`.
    # `network:` belongs on the stage, not on the step: the step-level spelling
    # still runs, but it is deprecated (removal in 2.0.0) and makes
    # `jailbee config validate` exit non-zero.
    - stage: sync-deps
      network: loose
      steps:
        - name: sync-deps
          run: UV_LINK_MODE=copy ~/.local/bin/uv sync
  on_start: []
  # No `detach: true` anywhere above, on purpose — it would cost the one thing
  # it looks like it buys. `agents.claude.autostart` (global.yaml) launches
  # Claude from the reserved `agents` stage, which jailbee inserts at the
  # *attach boundary* of on_start, so `jailbee new --tmux` (or `after_new:
  # tmux`) lands in the `claude` window with Claude already up. A `detach: true`
  # in on_create hands the session over before on_start is reached at all;
  # on_start then runs entirely in the background supervisor and the claude
  # window is created *after* the attach, where `_attach_tmux` can no longer
  # select it by name and silently falls back to window 0. What it would buy
  # back is ~0.5 s: the uv cache is a shared mount (see `shared_caches`), so a
  # fresh container syncs from a warm cache.
  #
  # Detaching only pays off with the work moved into on_start *behind* an
  # explicit `- stage: agents` carrying `detach: true` — that one stage stays
  # blocking and defers what follows. Not worth it here: it would re-run
  # `uv sync` (and its loose-network window) on every single container start.

new:
  clone_from: local
