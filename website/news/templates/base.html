<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <meta property="og:title" content="{{ og_title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:type" content="{{ og_type }}" />
    <meta property="og:site_name" content="JailBee" />
    {% if published %}<meta property="article:published_time" content="{{ published }}" />{% endif %}
    <meta property="og:image" content="{{ og_image }}" />
    {% if og_image_width %}<meta property="og:image:width" content="{{ og_image_width }}" />
    <meta property="og:image:height" content="{{ og_image_height }}" />{% endif %}
    <meta property="og:image:alt" content="{{ og_image_alt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/img/jailbee-logo.png" />
    <link rel="stylesheet" href="/assets/style.css?v={{ style_hash }}" />
    <link rel="stylesheet" href="/assets/news.css?v={{ news_hash }}" />
    <link rel="alternate" type="application/rss+xml" title="JailBee News" href="/news/feed.xml" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {{ topbar }}
    <main class="wrap news-main">{% block content %}{% endblock %}</main>
    <footer>
      <div class="wrap">
        <div class="footer__brand">
          <img class="footer__mark" src="/assets/img/jailbee-mark.png" alt="" width="340" height="345" />
          <span class="footer__word">J<em>ai</em>lBee</span>
        </div>
        <p>JailBee is free software under the GNU General Public License v3.0 or later. ·
          <a href="https://github.com/VRTFinland/jailbee">GitHub</a> ·
          <a href="https://www.youtube.com/@JailBeeSandbox" rel="noopener">YouTube</a></p>
        <a class="footer__gisgro" href="https://gisgro.com" rel="noopener">
          <img src="/assets/img/gisgro-logo.svg" width="140" height="25" alt="GISGRO" />
        </a>
        <p class="footer__copyright">© 2026 GISGRO Oy</p>
      </div>
    </footer>
    {% if video_hash %}<script src="/assets/lite-yt.js?v={{ video_hash }}" defer></script>{% endif %}
  </body>
</html>
