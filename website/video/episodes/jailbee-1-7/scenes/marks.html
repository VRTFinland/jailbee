<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Marks and the bulk menu: the two real crops, rings on the marked rows,
     on the counts in the top bar and repo header, then on the menu.
     params.at: narration fractions for rows/counts/menu/menuring. -->
<link rel="stylesheet" href="../../../lib/base.css" />
<style>
  .head { position: absolute; left: var(--edge); top: 72px; }
  .head h2 { font-size: 60px; margin-top: 16px; }
  .marks { position: absolute; left: var(--edge); top: 232px; }
  .bulk { position: absolute; left: 1250px; top: 712px; }
  html[data-format="short"] .head { top: 200px; right: var(--edge); }
  html[data-format="short"] .head h2 { font-size: 72px; }
  html[data-format="short"] .marks { left: 20px; top: 560px; }
  html[data-format="short"] .bulk { left: 260px; top: 1060px; }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div class="kicker">Many containers at once</div>
    <h2>Mark them, then <span class="amber">act on all</span></h2>
  </div>
  <div class="frame marks"><img class="shot" src="../../../../assets/news/jailbee-1-7-marks.png" alt="" /></div>
  <div class="frame bulk"><img class="shot" src="../../../../assets/news/jailbee-1-7-bulk-menu.png" alt="" /></div>
</div>
<script src="../../../lib/runtime.js"></script>
<script>
  JB.scene(({ params, format, at, when, show, zoom, ring }) => {
    // Each a fraction of the narration or a phrase from it (see runtime.js).
    const t = {
      rows: "Space marks", counts: "a container", menu: "the menu then acts",
      menuring: "each entry says", ...(params.at || {}),
    };
    const marks = zoom(document.querySelector(".marks img"), format === "short" ? 1.5 : 2);
    const bulk = zoom(document.querySelector(".bulk img"), 2);
    show(".head", 0.15);
    show(".marks", 0.25, null, 30);
    show(ring(marks, [0, 139, 694, 66]), when(t.rows), when(t.menu), 0);
    if (t.counts != null) {
      show(ring(marks, [390, 2, 66, 16]), when(t.counts), when(t.menu), 0);
      show(ring(marks, [168, 36, 22, 16]), when(t.counts), when(t.menu), 0);
    }
    show(".bulk", when(t.menu), null, 40);
    if (t.menuring != null) show(ring(bulk, [6, 16, 266, 138]), when(t.menuring), null, 0);
  });
</script>
</body>
</html>
