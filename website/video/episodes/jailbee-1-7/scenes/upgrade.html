<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Upgrade and console: the commands only, typed out; no output is shown,
     because none was recorded (honesty rules, ../../README.md). -->
<link rel="stylesheet" href="../../../lib/base.css" />
<style>
  .head { position: absolute; left: var(--edge); top: 96px; }
  .head h2 { font-size: 60px; margin-top: 16px; }
  .term { position: absolute; left: var(--edge); top: 330px; width: 820px; }
  .line { white-space: nowrap; overflow: hidden; }
  .typed { display: inline-block; overflow: hidden; vertical-align: bottom; white-space: nowrap; }
  .gap { height: 40px; }
  .copy { position: absolute; left: 1060px; top: 340px; width: 780px; }
  .point { position: relative; padding-left: 48px; font-size: 40px; margin-bottom: 34px; }
  .point::before { content: "✓"; position: absolute; left: 0; color: var(--green); }
  .point.console::before { content: "›"; color: var(--amber); }
</style>
</head>
<body>
<div class="stage">
  <div class="head">
    <div class="kicker">Upgrade and console</div>
    <h2>One command after every update</h2>
  </div>
  <div class="term">
    <div class="line" data-at="0.1"><span class="prompt">$ </span><span class="typed">uv tool upgrade jailbee</span></div>
    <div class="line" data-at="0.2"><span class="prompt">$ </span><span class="typed">jailbee upgrade</span></div>
    <div class="gap"></div>
    <div class="line" data-at="0.76"><span class="prompt">$ </span><span class="typed">jailbee console</span></div>
  </div>
  <div class="copy">
    <div class="point" data-at="0.32">An image rebuild or a config apply, where the release needs one</div>
    <div class="point" data-at="0.52">In every repository you use</div>
    <div class="point" data-at="0.63">No container restarted</div>
    <div class="point console" data-at="0.82">An interactive prompt, with completion and history</div>
  </div>
</div>
<script src="../../../lib/runtime.js"></script>
<script>
  JB.scene(({ at, anim, show }) => {
    show(".head", 0.15);
    show(".term", 0.3, null, 20);
    for (const line of document.querySelectorAll(".term .line")) {
      const typed = line.querySelector(".typed");
      const n = typed.textContent.length;
      const from = at(Number(line.dataset.at));
      show(line, from - 0.05, null, 0);
      anim(typed, [{ width: "0ch" }, { width: `${n}ch` }], from, from + n * 0.045, `steps(${n}, end)`);
    }
    for (const point of document.querySelectorAll(".copy .point")) show(point, at(Number(point.dataset.at)));
  });
</script>
</body>
</html>
