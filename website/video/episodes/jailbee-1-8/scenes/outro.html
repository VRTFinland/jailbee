<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Get JailBee</title><link rel="stylesheet" href="episode.css"></head><body>
<img class="hero" src="../assets/orchestration.png" alt="Illustration of separate bee environments connected to a coordinator">
<div class="hero-copy"><div class="kicker">Free and open source / Linux hosts</div><div class="wordmark">J<span>ai</span>lBee 1.8</div><h1>Agents prepare.<br><span class="amber">Humans publish.</span></h1><p class="sub">Separate environments.<br>Bounded permissions.</p><div class="url">jailbee.gisgro.io</div></div>
<script src="../../../lib/runtime.js"></script><script>
JB.scene(({word, show, format}) => {
  show('.hero', .1); show('.wordmark', .2);
  show('h1', format === 'short' ? word('Humans publish') : word('One coordinator'));

    document.querySelector('.sub').textContent = 'Full tour on the channel';
    show('.sub', word('full tour')); show('.url', word('full tour'));
  } else {
    show('.sub', word('Separate environments')); show('.url', word('jailbee dot gisgro dot io'));
  }
});
</script></body></html>
