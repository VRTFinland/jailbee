[project]
name = "jailbee-demo"
version = "0.1.0"
description = "A tiny app used to demonstrate jailbee in the workflow videos."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # httpx2, not httpx: starlette.testclient deprecates plain httpx and prints a
    # StarletteDeprecationWarning on every run — including the pytest run the
    # agent does on camera in video A.
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
